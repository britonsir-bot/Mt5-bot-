[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-ai-trading-bot"
version = "0.1.0"
description = "Backend-first scaffold for an MT5 AI trading bot desktop application."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7; platform_system != 'Linux'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
