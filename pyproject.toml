[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-ai-trading-bot"
version = "0.1.0"
description = "Backend-first scaffold for an MT5 AI trading bot desktop application."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7; platform_system != 'Linux'",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8"]

[project.scripts]
mt5-bot = "main:main"

[tool.setuptools]
packages = ["ai", "config", "core", "database", "gui"]
py-modules = ["app", "main"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
