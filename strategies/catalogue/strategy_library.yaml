      breakout above the mother bar's high (long) or below its low
      (short). Filter: only trade IB breakouts in the direction of
      the H4 trend (EMA 50 vs 200). Inside bars are the purest form
      of price action — no indicators needed beyond price structure.
    instruments: [forex, gold, indices, crypto]
