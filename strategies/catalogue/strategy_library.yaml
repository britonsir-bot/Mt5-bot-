    profit_factor: 1.9
    max_drawdown_pct: 15
    backtest_period: "2018-2024"
    confidence: medium
    bot_compatible: true

  # ===========================================================================
  # Strategy Dependency Matrix
  # ===========================================================================
dependencies:
  complementary_pairs:
    - pair: [trend_following_200sma, mean_reversion_rsi]
      note: "Trend following captures trends; mean reversion profits during trend pauses. Low correlation."
    - pair: [turtle_trading, bollinger_squeeze_breakout]
      note: "Turtle works in sustained trends; BB squeeze captures the trend initiation."
    - pair: [carry_trade, time_series_momentum]
      note: "Carry collects yield; TSMOM captures price trends. Different return drivers."
    - pair: [turnaround_tuesday, overnight_gap_fade]
      note: "Both calendar-based but different days/setups. Combined coverage of weekly patterns."
    - pair: [supertrend_strategy, inside_bar_breakout]
      note: "SuperTrend captures large trending moves; Inside Bar catches the pullbacks within those trends."
    - pair: [ichimoku_cloud, ma_ribbon_breakout]
      note: "Both are trend-confirmation systems. Ichimoku provides structure; MA Ribbon provides momentum. Run together for extra confirmation."
    - pair: [keltner_channel_breakout, heikin_ashi_reversal]
      note: "Keltner catches volatility expansions; HA reversal catches exhaustion turns. Cover both breakout and exhaustion scenarios."
    - pair: [index_arbitrage, delta_neutral]
      note: "Index arb captures pricing inefficiencies; delta-neutral captures vol surface. Both market-neutral — low correlation."
    - pair: [directional_change, drl_adaptive]
      note: "DC provides event-driven signals; DRL learns to exploit them dynamically. Complementary at the signal + execution layer."
    - pair: [event_arbitrage, carry_trade]
      note: "Event arb captures M&A spreads; carry collects yield. Both are non-directional with different return drivers. Near-zero correlation."

  conflicting_pairs:
    - pair: [trend_following_200sma, mean_reversion_rsi]
      note: "Trend: go with the trend. Mean reversion: fade extremes. In strong trends, mean reversion signals are dangerous."
    - pair: [turtle_trading, bollinger_band_mean_reversion]
      note: "Turtle buys breakouts; BB mean reversion fades them. Opposite philosophies."
    - pair: [supertrend_strategy, williams_r_mean_reversion]
      note: "SuperTrend follows the trend; Williams %R fades extremes. Simultaneously active in opposing directions = guaranteed loss on one side."
    - pair: [ichimoku_cloud, heikin_ashi_reversal]
      note: "Ichimoku follows trends; HA reversal fades trend exhaustion. Can produce contradictory signals at major turning points."

  requires_regime_filter:
    strategies:
      - turtle_trading
      - donchian_breakout
      - bollinger_band_mean_reversion
      - mean_reversion_rsi
      - williams_r_mean_reversion
      - heikin_ashi_reversal
      - parabolic_sar_trend
    note: "These strategies produce many false signals outside their optimal regime. Always pair with market_regime_detector."

