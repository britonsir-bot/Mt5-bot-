  - id: williams_r_mean_reversion
    name: "Williams %R Oversold/Overbought Reversal"
    category: mean_reversion
    market_regime: range_bound
    description: >
      Williams %R oscillates between 0 and -100, measuring close relative
      to the N-period high-low range. Values below -80 signal oversold
      conditions; above -20 signal overbought. Enter on %R crossing back
      above -80 (long) or below -20 (short). Filter: only trade when
      ADX < 25 (ranging markets) and price has returned to within the
      Bollinger Bands. %R is more sensitive than RSI to short-term
      extremes, producing earlier signals.
    instruments: [forex, gold, indices]
    holding_period: "1-5 bars"
    timeframe: M15
    evidence:
      source: "Larry Williams (1973); Quantified Strategies backtests"
      key_finding: "Williams %R crosses above -80 produce mean-reversion signals 1-2 bars earlier than RSI(14) equivalents. Win rate 60-68% in ranging conditions with ADX < 25 filter. False signals spike in trending markets — MUST use ADX filter."
    expected_win_rate_pct: 63
    profit_factor: 1.55
    max_drawdown_pct: 9
    backtest_period: "2000-2024"
    confidence: medium_high
    bot_compatible: true

