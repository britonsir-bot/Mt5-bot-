# =============================================================================
# STRATEGY LIBRARY
# =============================================================================
strategies:

  # ===========================================================================
  # CATEGORY: TREND FOLLOWING
  # ===========================================================================

  - id: time_series_momentum
    name: "Time-Series Momentum (TSMOM)"
    category: trend_following
    market_regime: strong_trend
    description: >
      Go long assets with positive excess return over the past N months;
      go short those with negative returns. Volatility-scaled position sizing
      equalizes risk contribution across assets. This is the canonical
      academic trend-following strategy.
    instruments: [forex, indices, commodities, bonds]
    holding_period: "1 month"
    timeframe: D1
    evidence:
      source: "Moskowitz, Ooi & Pedersen (2012) — Journal of Financial Economics"
      sharpe_ratio: 1.15
      key_finding: "TSMOM Sharpe ratio is 30% higher than buy-and-hold; works across 58 futures/forwards in equities, bonds, currencies, and commodities."
    expected_win_rate_pct: 42
    profit_factor: 1.85
    max_drawdown_pct: 15
    backtest_period: "1985-2024"
    confidence: high
    bot_compatible: true

  - id: turtle_trading
    name: "Turtle Trading System"
    category: trend_following
    market_regime: strong_trend
    description: >
      Richard Dennis' legendary system: enter on 20-day or 55-day Donchian
      channel breakouts. Volatility-normalized position sizing using ATR (N).
      Pyramid up to 4 units every 0.5N. Exit on 10-day or 20-day opposite
      breakout. Accepts many small losses for a few enormous wins.
    instruments: [futures, forex, commodities]
    holding_period: "days to weeks"
    timeframe: D1
    evidence:
      source: "Richard Dennis / TurtleTrader.com — real-money track record 1984-1988"
      key_finding: "~80% annualized returns over 4 years. Generated $175M+ profits. Still viable in modern markets with regime awareness."
    expected_win_rate_pct: 38
    profit_factor: 2.1
    max_drawdown_pct: 22
    backtest_period: "1984-2024"
    confidence: high
    bot_compatible: true

  - id: donchian_breakout
    name: "Donchian Channel Breakout"
    category: trend_following
    market_regime: strong_trend
    description: >
      Simplified Turtle: enter long when price breaks above the N-period
      high (typically 20 or 55); exit when price breaks below the M-period
      low. Pure trend-following with no indicators — just price structure.
    instruments: [forex, indices, commodities]
    holding_period: "days"
    timeframe: D1
    evidence:
      source: "Multiple academic and practitioner studies; cornerstone of CTA industry"
      key_finding: "Donchian breakouts have been the backbone of the $400B+ managed futures industry for 40+ years. Still generates positive expectancy in trending regimes."
    expected_win_rate_pct: 40
    profit_factor: 1.7
    max_drawdown_pct: 20
    backtest_period: "1990-2024"
    confidence: high
    bot_compatible: true

  - id: dual_momentum
    name: "Dual Momentum (Antonacci GEM)"
    category: trend_following
    market_regime: strong_trend
    description: >
      Monthly rotation: compare 12-month returns of US equities vs global
      equities. Invest in the winner ONLY if its absolute return exceeds
      T-bills. Otherwise, park in bonds. ~1.5 trades/year.
    instruments: [indices, ETFs]
    holding_period: "1 month"
    timeframe: MN1
    evidence:
      source: "Gary Antonacci — Dual Momentum Investing (2012)"
      key_finding: "Backtested 1950-2018. Max drawdown ~30% vs ~55% for buy-and-hold S&P 500. Correlation with S&P 500 = 0.50."
    expected_win_rate_pct: 65
    profit_factor: 2.3
    max_drawdown_pct: 30
    backtest_period: "1950-2024"
    confidence: high
    bot_compatible: true

  - id: trend_following_200sma
    name: "200-Day SMA Trend Following"
    category: trend_following
    market_regime: strong_trend
    description: >
      Long when price > 200-day SMA; exit to cash/bonds when price < 200-SMA.
      Simple, timeless, and avoids catastrophic bear market drawdowns.
    instruments: [indices, forex]
    holding_period: "weeks to months"
    timeframe: D1
    evidence:
      source: "Meb Faber — A Quantitative Approach to Tactical Asset Allocation"
      key_finding: "Reduces max drawdown by ~50% vs buy-and-hold while sacrificing only ~1.5% annualized return. Works globally across asset classes."
    expected_win_rate_pct: 45
    profit_factor: 1.6
    max_drawdown_pct: 18
    backtest_period: "1900-2024"
    confidence: high
    bot_compatible: true

  - id: adaptive_ema_adx
    name: "Adaptive EMA/ADX Trend Following"
    category: trend_following
    market_regime: weak_trend
    description: >
      Dynamic trend following: EMA crossover (50/200) sets direction;
      ADX(14) > 25 filters for trending regime; ADX slope confirms trend
      is strengthening. Exit when ADX rolls over or EMA reverses.
    instruments: [forex, indices, gold]
    holding_period: "days"
    timeframe: H4
    evidence:
      source: "Practitioner research; common CTA building block"
      key_finding: "ADX > 25 filter eliminates ~40% of whipsaw trades in ranging markets. Combining EMA direction with ADX strength improves profit factor by ~30% vs pure EMA crossover."
    expected_win_rate_pct: 48
    profit_factor: 1.55
    max_drawdown_pct: 14
    backtest_period: "2000-2024"
    confidence: medium_high
    bot_compatible: true

  - id: triple_ema_crossover
    name: "Triple EMA Crossover"
    category: trend_following
    market_regime: weak_trend
    description: >
      Three EMAs (20/50/200) must be in perfect alignment for entry:
      EMA20 > EMA50 > EMA200 for long. Exit when EMA20 crosses below
      EMA50. The triple confirmation reduces false signals.
    instruments: [forex, indices]
    holding_period: "days to weeks"
    timeframe: H4
    evidence:
      source: "Practitioner strategy; widely used in systematic CTA programs"
      key_finding: "Win rate 42-45% but win/loss ratio > 2:1. Triple alignment filters ~60% of pure EMA(20/50) crossover signals, improving profit factor."
    expected_win_rate_pct: 43
    profit_factor: 1.5
    max_drawdown_pct: 16
    backtest_period: "2000-2024"
    confidence: medium
    bot_compatible: true

  # ===========================================================================
  # CATEGORY: MEAN REVERSION
  # ===========================================================================

  - id: mean_reversion_rsi
    name: "RSI(2) Mean Reversion (Connors)"
    category: mean_reversion
    market_regime: range_bound
    description: >
      Larry Connors' classic: buy when 2-period RSI drops below 10
      (extreme oversold) AND price is above 200-SMA (uptrend filter).
      Exit when RSI(2) crosses above 50 or close > 5-SMA. Holy Grail
      variant triggers on RSI(2) < 5.
    instruments: [indices, forex, gold]
    holding_period: "1-5 days"
    timeframe: D1
    evidence:
      source: "Larry Connors — Short Term Trading Strategies That Work"
      key_finding: "Win rate > 70% when price > 200-SMA. Most extensively studied mean-reversion strategy in retail trading literature. Independently verified across decades."
    expected_win_rate_pct: 70
    profit_factor: 2.5
    max_drawdown_pct: 12
    backtest_period: "1993-2024"
    confidence: high
    bot_compatible: true

  - id: vwap_reversion
    name: "VWAP Mean Reversion"
    category: mean_reversion
    market_regime: range_bound
    description: >
      Institutional execution concept: when price deviates > 1.5-2.0
      standard deviations from the session VWAP, fade the move toward
      VWAP. VWAP acts as an intraday fair-value anchor. ADX < 25
      confirms ranging conditions.
    instruments: [indices, forex]
    holding_period: "intraday (minutes to hours)"
    timeframe: M15
    evidence:
      source: "SSRN 6454659 — ADX-Conditioned VWAP Strategy in FX"
      key_finding: "Mean reversion to VWAP produces average edge of ~0.89 percentage points — roughly 6x typical transaction costs. ADX filter improves performance in ranging regimes."
    expected_win_rate_pct: 62
    profit_factor: 1.5
    max_drawdown_pct: 8
    backtest_period: "2010-2024"
    confidence: medium_high
    bot_compatible: true

  - id: bollinger_band_mean_reversion
    name: "Bollinger Band Mean Reversion"
    category: mean_reversion
    market_regime: range_bound
    description: >
      Fade Bollinger Band extremes: when price closes below the lower
      BB(20,2) and RSI(14) < 30, go long. Target: BB middle band or
      SMA(20). Stop: recent swing low minus ATR buffer. Works best
      when ADX < 25 (ranging market).
    instruments: [forex, gold, indices]
    holding_period: "3-7 bars"
    timeframe: H1
    evidence:
      source: "Quantified Strategies; Bollinger (2001)"
      key_finding: "~85% of price action stays within Bollinger Bands. Touches of the outer bands in ranging markets revert to the middle band within 5 bars ~65% of the time."
    expected_win_rate_pct: 65
    profit_factor: 1.6
    max_drawdown_pct: 10
    backtest_period: "2000-2024"
    confidence: high
    bot_compatible: true

  - id: five_day_low_range
    name: "5-Day Low of the Range"
    category: mean_reversion
    market_regime: range_bound
    description: >
      When close is below the 5-day low AND IBS (Internal Bar Strength)
      < 0.25, go long. Exit after 5 days. Simple price-action mean
      reversion with no indicators beyond price structure.
    instruments: [indices, forex]
    holding_period: "5 days"
    timeframe: D1
    evidence:
      source: "Quantified Strategies"
      key_finding: "73% win rate, 0.7% avg gain per trade, 10.76% annualized return. 6x the average 5-day return. Peak profitability at 3-7 day hold."
    expected_win_rate_pct: 73
    profit_factor: 2.8
    max_drawdown_pct: 20
    backtest_period: "1993-2024"
    confidence: high
    bot_compatible: true

  # ===========================================================================
  # CATEGORY: BREAKOUT
  # ===========================================================================

  - id: opening_range_breakout
    name: "Opening Range Breakout (ORB)"
    category: breakout
    market_regime: high_volatility
    description: >
      Define the opening range as the high/low of the first 15-30
      minutes of the session. Enter long on a breakout above the
      OR high (or short below the OR low). Target: 1-2x the OR
      width. Stop: opposite side of the OR.
    instruments: [indices, gold]
    holding_period: "intraday (minutes to hours)"
    timeframe: M5
    evidence:
      source: "Quantified Strategies; professional day trader research"
      key_finding: "198 trades, 0.27% avg gain, 65% win rate, profit factor 2.0. The 15-min OR produces the best balance of signal reliability (56% WR) and frequency."
    expected_win_rate_pct: 56
    profit_factor: 2.0
    max_drawdown_pct: 12
    backtest_period: "2005-2024"
    confidence: high
    bot_compatible: true

  - id: donchian_breakout_intraday
    name: "Intraday Donchian Breakout"
    category: breakout
    market_regime: strong_trend
    description: >
      Intraday adaptation of the Donchian channel: track the N-period
      high/low (typically 20 bars on M15). Enter on breakout with
      volume confirmation. Exit on opposite breakout or time stop.
    instruments: [forex, gold]
    holding_period: "intraday"
    timeframe: M15
    evidence:
      source: "Adapted from Turtle Trading / Donchian channel research"
      key_finding: "Works on lower timeframes with the same logic. Adding volume confirmation reduces false breakouts by ~30%."
    expected_win_rate_pct: 44
    profit_factor: 1.6
    max_drawdown_pct: 15
    backtest_period: "2010-2024"
    confidence: medium_high
    bot_compatible: true

  # ===========================================================================
  # CATEGORY: VOLATILITY
  # ===========================================================================

  - id: bollinger_squeeze_breakout
    name: "Bollinger Band Squeeze Breakout"
    category: volatility
    market_regime: low_volatility
    description: >
      Detect volatility contraction: BB bandwidth at 125-period low
      (the "squeeze"). Enter on the first candle that closes outside
      the bands. Direction determined by breakout direction.
      Volatility is mean-reverting — extreme lows precede expansions.
    instruments: [forex, gold, indices]
    holding_period: "5-15 bars"
    timeframe: H1
    evidence:
      source: "John Bollinger; Quantified Strategies"
      key_finding: "BB width in bottom decile of 125-period range precedes above-average directional moves. Breakout candle direction is correct ~55-60% of the time with proper filters."
    expected_win_rate_pct: 55
    profit_factor: 1.8
    max_drawdown_pct: 10
    backtest_period: "2000-2024"
    confidence: high
    bot_compatible: true

  - id: crypto_momentum_breakout
    name: "Crypto Momentum Breakout"
    category: volatility
    market_regime: high_volatility
    description: >
      Donchian channel breakout adapted for 24/7 crypto markets.
      Entry on 20-bar high breakout with volume spike confirmation
      (≥ 1.5x average). ATR-normalized position sizing and trailing
      stops (3× ATR) give crypto's wild swings room to develop.
      No session restrictions, all 7 trading days, higher volatility
      thresholds throughout.
    instruments: [BTCUSD, ETHUSD, SOLUSD, BNBUSD]
    holding_period: "hours to days"
    timeframe: H4
    evidence:
      source: "Adapted from Donchian/Turtle research for crypto markets"
      key_finding: "Crypto trends are among the strongest in any asset class. BTC/ETH trend-following strategies have produced Sharpe ratios of 0.8-1.2 since 2017. 24/7 market structure requires all-day trading and wider stops."
    expected_win_rate_pct: 42
    profit_factor: 1.8
    max_drawdown_pct: 22
    backtest_period: "2017-2024"
    confidence: medium
    bot_compatible: true

  - id: atr_breakout
    name: "ATR Volatility Breakout"
    category: volatility
    market_regime: high_volatility
    description: >
      Enter when price moves > N × ATR from the session open (or
      yesterday's close) in a single bar. The expansion signals a
      volatility regime shift. Ride the momentum, trail with ATR-based
      stop. Effective during news events and high-volatility regimes.
    instruments: [gold, crypto, forex]
    holding_period: "intraday"
    timeframe: M5
    evidence:
      source: "Practitioner strategy; common in systematic volatility programs"
      key_finding: "ATR breakouts capture volatility expansion events. Win rate is lower (~38-42%) but average win is 2-3x the average loss. Best during FOMC, NFP, and geopolitical events."
    expected_win_rate_pct: 40
    profit_factor: 1.8
    max_drawdown_pct: 18
    backtest_period: "2015-2024"
    confidence: medium
    bot_compatible: true

  - id: overnight_gap_fade
    name: "Overnight Gap Fade"
    category: volatility
    market_regime: high_volatility
    description: >
      Fade large overnight gaps in equity indices: when S&P 500 gaps
      down > 0.5% at the open, buy the open and target the prior
      close (gap fill). Statistical tendency: ~70% of gaps > 0.5%
      fill within the session. IBS and RSI filters improve edge.
    instruments: [indices]
    holding_period: "intraday"
    timeframe: M5
    evidence:
      source: "Quantified Strategies; Systematic Individual Investor"
      key_finding: "SPY gap downs > 0.15% with IBS < 0.25 and RSI(5) < 0.45: strong gap-fill tendency. Gap fill probability decreases with gap size > 2%."
    expected_win_rate_pct: 65
    profit_factor: 1.7
    max_drawdown_pct: 8
    backtest_period: "2000-2024"
    confidence: medium_high
    bot_compatible: true

  # ===========================================================================
  # CATEGORY: MOMENTUM / CROSS-SECTIONAL
  # ===========================================================================

  - id: cross_sectional_momentum
    name: "Cross-Sectional Momentum"
    category: momentum
    market_regime: strong_trend
    description: >
      Rank N assets by their return over the past M months. Go long
      the top quintile, short the bottom quintile. Rebalance monthly.
      This is the Jagadeesh & Titman (1993) momentum anomaly applied
      across a universe of instruments.
    instruments: [forex basket, indices, commodities]
    holding_period: "1 month"
    timeframe: MN1
    evidence:
      source: "Jagadeesh & Titman (1993) — Journal of Finance"
      key_finding: "The momentum premium is one of the most robust factors in finance. Cross-sectional momentum generates Sharpe ratios of 0.5-0.8 across asset classes. Confirmed in >200 years of global data."
    expected_win_rate_pct: 55
    profit_factor: 1.9
    max_drawdown_pct: 20
    backtest_period: "1965-2024"
    confidence: high
    bot_compatible: true

  - id: macd_histogram
    name: "MACD Histogram Reversal"
    category: momentum
    market_regime: weak_trend
    description: >
      MACD histogram (MACD_line − Signal_line) direction change signals
      momentum shifts. Long when histogram ticks up while below zero
      AND price > 200-SMA. Exit when histogram ticks down from above
      zero. The histogram leads the MACD crossover by 1-3 bars.
    instruments: [indices, forex, gold]
    holding_period: "5-20 days"
    timeframe: D1
    evidence:
      source: "Quantified Strategies"
      key_finding: "Histogram direction changes before MACD/Signal crossover, giving earlier entry. Combined with trend filter, produces consistent profitability on SPY and sector ETFs."
    expected_win_rate_pct: 52
    profit_factor: 1.4
    max_drawdown_pct: 12
    backtest_period: "1993-2024"
    confidence: medium_high
    bot_compatible: true

  # ===========================================================================
  # CATEGORY: SEASONAL / CALENDAR EFFECTS
  # ===========================================================================

  - id: turnaround_tuesday
    name: "Turnaround Tuesday"
    category: seasonal_calendar
    market_regime: all_regimes
    description: >
      After a weak Monday (close > 1% below Friday's close), buy at
      Monday close and exit at Tuesday close. Enhanced with IBS < 0.2
      filter. Exploits weekend information digestion + Monday panic
      selling cycle.
    instruments: [indices]
    holding_period: "1-4 days"
    timeframe: D1
    evidence:
      source: "Larry Williams / Quantified Strategies"
      key_finding: "SPY since 1993: 212 trades, 56% WR, 1.8% CAGR (2.5% exposure). Enhanced variant: 495 trades, 69% WR, 7% CAGR. Only works buying weakness."
    expected_win_rate_pct: 60
    profit_factor: 1.5
    max_drawdown_pct: 15
    backtest_period: "1993-2024"
    confidence: high
    bot_compatible: true

  - id: sell_in_may
    name: "Sell in May and Go Away"
    category: seasonal_calendar
    market_regime: all_regimes
    description: >
      Invest in S&P 500 from November through April; switch to bonds
      or cash from May through October. The seasonal anomaly: nearly
      all equity index gains accrue in the Nov-Apr period.
    instruments: [indices]
    holding_period: "6 months"
    timeframe: D1
    evidence:
      source: "Academic calendar effects research; Bouman & Jacobsen (2002)"
      key_finding: "Nov-Apr returns significantly exceed May-Oct returns across 37 of 37 countries studied. S&P 500: Nov-Apr annualized ~7% vs May-Oct ~0.5% since 1950."
    expected_win_rate_pct: 60
    profit_factor: 2.0
    max_drawdown_pct: 25
    backtest_period: "1950-2024"
    confidence: medium_high
    bot_compatible: true

  - id: santa_claus_rally
    name: "Santa Claus Rally"
    category: seasonal_calendar
    market_regime: all_regimes
    description: >
      Buy S&P 500 at close on Dec 23, sell at close on Jan 2.
      Historically, the last 5 trading days of December + first 2
      of January produce outsized returns (~1.3% average over 7 days).
    instruments: [indices]
    holding_period: "~7 trading days"
    timeframe: D1
    evidence:
      source: "Yale Hirsch / Stock Trader's Almanac"
      key_finding: "Average S&P 500 gain of 1.3% over the 7-day Santa Claus Rally period since 1969. Occurs ~75% of years. Absence of rally is bearish signal (January Barometer)."
    expected_win_rate_pct: 75
    profit_factor: 3.0
    max_drawdown_pct: 3
    backtest_period: "1969-2024"
    confidence: medium
    bot_compatible: true

  - id: turn_of_month
    name: "Turn-of-the-Month Effect"
    category: seasonal_calendar
    market_regime: all_regimes
    description: >
      Buy S&P 500 at close on the last trading day of the month;
      sell at close on the 4th trading day of the new month.
      Concentrated returns from pension fund inflows and 401(k)
      contributions.
    instruments: [indices]
    holding_period: "~4 trading days"
    timeframe: D1
    evidence:
      source: "Lakonishok & Smidt (1988); multiple confirmations"
      key_finding: "Turn-of-month days account for nearly all monthly S&P 500 gains since 1928. The 4-day window captures pension/401(k) inflow-driven buying pressure."
    expected_win_rate_pct: 65
    profit_factor: 2.5
    max_drawdown_pct: 5
    backtest_period: "1928-2024"
    confidence: medium_high
    bot_compatible: true

  # ===========================================================================
  # CATEGORY: STATISTICAL ARBITRAGE
  # ===========================================================================

  - id: pairs_trading_cointegration
    name: "Pairs Trading (Cointegration)"
    category: statistical_arbitrage
    market_regime: range_bound
    description: >
      Identify two cointegrated assets (e.g., GOLD/SILVER, EURUSD/GBPUSD).
      When the spread deviates > 2 standard deviations from its mean,
      short the outperformer and long the underperformer. Exit when
      the spread mean-reverts. Market-neutral by construction.
    instruments: [forex, commodities, ETFs]
    holding_period: "days to weeks"
    timeframe: H1
    evidence:
      source: "Gatev, Goetzmann & Rouwenhorst (2006); multiple academic studies"
      key_finding: "Pairs trading generates annualized excess returns of ~11% in equities. Cointegration-based pairs outperform correlation-based pairs. Market neutrality provides crisis alpha."
    expected_win_rate_pct: 55
    profit_factor: 1.6
    max_drawdown_pct: 12
    backtest_period: "2000-2024"
    confidence: medium_high
    bot_compatible: true

  - id: gold_silver_ratio
    name: "Gold/Silver Ratio Mean Reversion"
    category: statistical_arbitrage
    market_regime: range_bound
    description: >
      Trade the Gold/Silver ratio: when the ratio exceeds its 200-day
      SMA by > 2 standard deviations, short gold / long silver.
      When it drops below by > 2 SD, long gold / short silver.
      The ratio has mean-reverted for centuries.
    instruments: [XAUUSD, XAGUSD]
    holding_period: "days to weeks"
    timeframe: D1
    evidence:
      source: "Practitioner strategy; centuries of historical ratio data"
      key_finding: "The gold/silver ratio has oscillated between ~15 and ~125 over centuries. 2-SD deviations from 200-SMA mean-revert within 30 days ~70% of the time."
    expected_win_rate_pct: 60
    profit_factor: 1.7
    max_drawdown_pct: 10
    backtest_period: "1975-2024"
    confidence: medium_high
    bot_compatible: true

