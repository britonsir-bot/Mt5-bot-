  - id: keltner_channel_breakout
    name: "Keltner Channel Volatility Breakout"
    category: volatility
    market_regime: high_volatility
    description: >
      Keltner Channels use ATR-based bands (vs standard deviation for
      Bollinger Bands), making them more responsive to actual volatility
      changes. Enter long when price closes above the upper Keltner
      Channel (20, 2.0 ATR) with volume confirmation. Exit when price
      closes back inside the channel. Stronger breakout signals than
      Bollinger Bands in trending markets.
    instruments: [forex, gold, indices, crypto]
    holding_period: "hours to days"
    timeframe: H1
    evidence:
      source: "Chester Keltner (1960); modern adaptations by systematic traders"
      key_finding: "Keltner Channel breakouts outperform Bollinger Band breakouts in trending regimes by ~15-20% profit factor. ATR-based bands adapt faster to volatility regime changes than standard deviation bands. Volume confirmation on breakout reduces false signals by ~25%."
